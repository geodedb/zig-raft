---
# GitLab CI/CD Pipeline for raft
# SPDX-License-Identifier: Apache-2.0

# Restrict pipeline execution to protected branches and merge requests
# to prevent unauthorized fork MR pipelines from running (SEC-0136).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

include:
  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-sast@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/security-secrets@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@v1.7.1

  # Code quality — zig-format@v1.2.1 removed: uses stale Zig download URL
  # and injects a cache key for zig-0.14.0. Replaced by inline job below.

  # SBOM
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@v1.7.1

  # Release
  - component: gitlab.com/devnw/ci-catalog/release-semantic@v1.7.1

variables:
  ZIG_VERSION: "0.15.2"

# Cache the Zig toolchain download across jobs to avoid re-downloading
# ~45 MB per job (PERF-014).
default:
  cache:
    key: "zig-${ZIG_VERSION}"
    paths:
      - zig-x86_64-linux-${ZIG_VERSION}/

stages:
  - lint
  - build
  - test
  - security
  - sbom
  - release

# Zig installation template
# Validates ZIG_VERSION to prevent shell injection via pipeline trigger API (SEC-0129).
# Skips download when cached (PERF-014).
.install-zig: &install-zig
  - |
    if ! echo "${ZIG_VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-dev\.[0-9]+\+[a-f0-9]+)?$'; then
      echo "ERROR: Invalid ZIG_VERSION format: '${ZIG_VERSION}'" >&2
      exit 1
    fi
  # QA-035: Skip apt-get when required tools are already present to save 30-60s per job.
  # QA-036 (Won't Do): Custom Docker image with pre-installed tools requires external
  # Docker registry infrastructure; managed at CI catalog level.
  - |
    if ! command -v curl >/dev/null 2>&1 || ! command -v xz >/dev/null 2>&1; then
      apt-get update && apt-get install -y curl xz-utils
    fi
  - |
    if [ ! -x "zig-x86_64-linux-${ZIG_VERSION}/zig" ]; then
      curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
      tar -xf zig.tar.xz
      rm -f zig.tar.xz
    fi
  - export PATH="$PWD/zig-x86_64-linux-${ZIG_VERSION}:$PATH"
  - zig version

# Override zig-format from CI catalog — the v1.2.1 component uses the old
# Zig download URL format (zig-linux-x86_64-*) which 404s for Zig >= 0.15.
# Use our own install script with the correct URL pattern.
zig-format:
  stage: test
  image: debian:bookworm-slim
  cache:
    key: "zig-${ZIG_VERSION}"
    paths:
      - zig-x86_64-linux-${ZIG_VERSION}/
  before_script:
    - *install-zig
  script:
    - zig fmt --check src/ tests/ build.zig

# Build job
build:
  stage: build
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build
  artifacts:
    paths:
      - zig-out/
    expire_in: 1 hour

# Unit tests — no needs: dependency since tests recompile from source;
# stage ordering (test after build) is sufficient (PERF-015).
test:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test --summary all

# Integration tests
test-integration:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test-integration --summary all

# Release optimization tests
test-release-safe:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseSafe --summary all

# Scenario tests (election, replication, snapshots, membership, persistence, file_storage)
test-scenarios:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test-scenarios --summary all

# Chaos tests (randomized fault injection with deterministic replay)
test-chaos:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test-chaos --summary all

# Cross-compilation tests
test-cross-build:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build -Dtarget=x86_64-linux
    - zig build -Dtarget=aarch64-linux
    - zig build -Dtarget=x86_64-macos
    - zig build -Dtarget=aarch64-macos

# Benchmarks for performance regression detection (QA-012).
# Manual trigger only; allowed to fail since benchmark results can be noisy.
bench:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build bench --summary all
  when: manual
  allow_failure: true
